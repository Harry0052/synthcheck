name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Fixture demo
        run: |
          set +e
          python -m synthcheck compare fixtures/reference fixtures/changed \
            --contract fixtures/contract/clinic.json \
            --json reports/demo.json \
            --html reports/demo.html
          code=$?
          set -e
          test "$code" -eq 1
          python - << 'PY'
          import json
          report = json.load(open("reports/demo.json", encoding="utf-8"))
          assert report["summary"]["status"] == "fail"
          assert report["summary"]["integrity"] == "pass"
          coverage = next(
              query for query in report["queries"]
              if query["id"] == "visit_follow_up_coverage_by_month"
          )
          north = next(
              group for group in coverage["groups"]
              if group["key"]["clinic_id"] == "north"
          )
          assert north["reference"]["value"] == "0.8"
          assert north["reference"]["numerator"] == 4
          assert north["reference"]["denominator"] == 5
          assert north["candidate"]["value"] == "0.4"
          assert north["candidate"]["numerator"] == 2
          assert north["decision"] == "fail"
          print("demo matched the hand oracle")
          PY

      - name: Upload demo reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-report
          path: reports/
          if-no-files-found: error
