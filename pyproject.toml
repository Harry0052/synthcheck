[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "synthcheck"
version = "0.1.0"
description = "Check fully synthetic relational clinic bundles against a declared integrity and aggregate-query contract."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["duckdb==1.4.2"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
synthcheck = "synthcheck.cli:main"

[tool.setuptools.packages.find]
include = ["synthcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
